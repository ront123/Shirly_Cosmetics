<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base:      #0f1117;
      --bg-surface:   #161b27;
      --bg-elevated:  #1c2333;
      --bg-hover:     #232d42;
      --border:       rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.13);
      --accent:        #6366f1;
      --accent-dark:   #4f46e5;
      --accent-light:  rgba(99,102,241,0.12);
      --accent-border: rgba(99,102,241,0.28);
      --text-primary:   #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted:     #64748b;
      
      --green:         #22c55e;
      --green-light:   rgba(34,197,94,0.10);
      --green-border:  rgba(34,197,94,0.20);
      
      --red:           #f43f5e;
      --red-light:     rgba(244,63,94,0.10);
      --red-border:    rgba(244,63,94,0.22);

      --amber:         #f59e0b;
      --amber-light:   rgba(245,158,11,0.10);
      --amber-border:  rgba(245,158,11,0.22);
    }

    body {
      width: 340px;
      font-family: 'Heebo', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--bg-base);
      color: var(--text-primary);
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
      background: linear-gradient(135deg, #a5b4fc, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .status-title {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .status-value {
      font-size: 14px;
      font-weight: 700;
    }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
    }

    .btn:hover {
      background-color: var(--accent-dark);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      background-color: var(--bg-elevated);
      color: var(--text-muted);
      border: 1px solid var(--border);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .info-box {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 10px;
    }

    .success {
      color: var(--green);
      background-color: var(--green-light);
      border: 1px solid var(--green-border);
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }

    .error {
      color: var(--red);
      background-color: var(--red-light);
      border: 1px solid var(--red-border);
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }

    .spinner {
      border: 2px solid rgba(255,255,255,0.2);
      border-top: 2px solid #ffffff;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20ZM11 7H13V13H11V7ZM11 15H13V17H11V15Z" fill="#6366f1"/>
      </svg>
      <h2>סנכרון שירלי קוסמטיקס 🔄</h2>
    </div>

    <div class="info-box">
      כדי להתחיל בסנכרון, עליך לפתוח את אתר <strong>Easybizy</strong> בלשונית הפעילה בדפדפן ולהתחבר לחשבונך. התוסף ימשוך את המידע באופן מאובטח באמצעות החיבור הקיים שלך.
    </div>

    <button id="sync-btn" class="btn" disabled>
      <span class="spinner" id="btn-spinner"></span>
      <span id="btn-text">סנכרן לקוחות עכשיו</span>
    </button>

    <div id="success-message" class="success"></div>
    <div id="error-message" class="error"></div>

    <div class="status-card">
      <div class="status-title">סטטוס חיבור:</div>
      <div id="connection-status" class="status-value">בודק חיבור לאתר...</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
